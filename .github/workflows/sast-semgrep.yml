name: Semgrep (multi-language SAST)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4
      - name: Disable semgrep scanner
        run: echo "Semgrep scanning is temporarily disabled."

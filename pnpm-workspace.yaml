packages:
  - "packages/*"

# NOTE: This project pins pnpm@9.15.4 (packageManager). pnpm 9 does NOT read
# overrides from pnpm-workspace.yaml (that is a pnpm 10 feature), so the
# security override pins that must actually take effect live in the root
# package.json under "pnpm.overrides". The entries below are retained for
# pnpm 10+ readers; keep them disjoint from package.json to avoid a
# duplicate-declaration error under pnpm 10.
overrides:
  fast-uri: 3.1.4
  ip-address: 10.1.1
  postcss: 8.5.18
  "postcss@8.4.31": 8.5.18
  qs: 6.15.2
  "brace-expansion@1.1.15": 1.1.16
  "brace-expansion@2.1.2": 2.1.2

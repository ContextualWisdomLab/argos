# OSV-Scanner suppressions for argos.
#
# Policy: single-CVE, documented, time-boxed entries only. This file does NOT
# disable or weaken the OSV gate — every other advisory still fails the build.
# Re-evaluate each entry on/before its ignoreUntil date; delete it the moment a
# compatible fixed version is reachable.

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
ignoreUntil = 2026-10-30T00:00:00Z
# brace-expansion "DoS via unbounded expansion length (OOM)". Advisory range is
# `<=5.0.7`, i.e. EVERY published version across all majors is affected and the
# only fixed release is 5.0.8. 5.0.8 is ESM-first (`"type":"module"`, tshy build:
# its CommonJS entry exports `{ default, expand }`, not a bare function), so a
# `require('brace-expansion')(...)` call — the pattern used by minimatch@3 and the
# wider CJS ecosystem — throws "expand is not a function" when forced to 5.0.8.
# In this repo brace-expansion is only reached transitively through dev/build-time
# tooling (ESLint -> @eslint/eslintrc -> minimatch@3, glob, vitest), never in the
# Next.js runtime bundle, so it is not exploitable in production. There is
# currently no runtime-reachable, API-compatible fixed version. GHSA-3jxr-9vmj-r5cp
# (the other brace-expansion advisory) IS fixed here by pinning the 1.x/2.x
# maintenance releases (1.1.17 / 2.1.3) via pnpm overrides. Remove this entry once
# ESLint/minimatch/glob ship brace-expansion >= 5.0.8 (or a back-ported CJS fix).
reason = "dev/build-only transitive (minimatch@3 via ESLint); sole fix 5.0.8 is ESM-first and breaks CJS require()-call consumers; not runtime-reachable. Revisit 2026-10-30."

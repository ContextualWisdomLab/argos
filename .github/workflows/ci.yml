name: CI
on:
  push:
    branches: [main, developmental, feat-*, "feature/**"]
  pull_request:
    branches: [main, developmental]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argos
          POSTGRES_PASSWORD: argos
          POSTGRES_DB: argos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: "ci-placeholder-secret-min-32-chars-here"
      JWT_SECRET: "ci-placeholder-jwt-secret-min-32-chars"
      DATABASE_URL: "postgresql://argos:argos@localhost:5432/argos"
      DIRECT_URL: "postgresql://argos:argos@localhost:5432/argos"
      SHADOW_DATABASE_URL: "postgresql://argos:argos@localhost:5432/argos_shadow"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-admin-password"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @argos/web exec prisma generate
      - run: pnpm --filter @argos/shared build
      - run: pnpm --filter argos-ai build
      - run: pnpm -r run typecheck
      - run: pnpm -r run lint
      - run: pnpm --filter argos-ai test
      - run: pnpm --filter @argos/shared test
      - name: Create isolated Prisma shadow database
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U argos -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE argos_shadow OWNER argos;"
      - name: Check schema/migration drift
        working-directory: packages/web
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - run: pnpm --filter @argos/web exec prisma migrate deploy
      - run: pnpm --filter @argos/web test
      - run: pnpm --filter @argos/web build

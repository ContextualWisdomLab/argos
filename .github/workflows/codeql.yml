name: "CodeQL"

on:
  push:
    branches: [ "main", "developmental" ]
  pull_request:
    branches: [ "main", "developmental" ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python', 'actions' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
      with:
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
      with:
        category: "/language:${{matrix.language}}"

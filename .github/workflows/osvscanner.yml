name: OSV-Scanner

on:
  pull_request:
    branches: [main, developmental]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@850616b2a0bf2cf3deaf51c278065cb9b5c00e12 # v2.3.8
        with:
          scan-args: |-
            --recursive
            .
